<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | AAYORA</title>
    <link rel="stylesheet" href="register.css">
</head>

<body>
    <div class="register-page">
        <!-- LEFT SIDE -->
        <div class="register-info">
            <h1>
                Register as a<br>
                New Customer
            </h1>

            <p>
                Register to view and buy products
                <br>
                from AAYORA Nepal.
            </p>
        </div>


        <!-- RIGHT SIDE FORM -->
        <div class="register-form">

            <form>

                <label for="username">
                    Username <span>*</span>
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    required
                >


                <label for="email">
                    Email <span>*</span>
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    required
                >


                <label for="password">
                    Password <span>*</span>
                </label>

                <input
                    type="password"
                     id="password" 
                     name="password" 
                    required
                >


                <label for="confirm-password">
                    Confirm Password <span>*</span>
                </label>

                <input
                    type="password"
                    id="confirm-password"
                    name="confirm-password"
                    required
                >


                <div class="human-check">

                    <input
                        type="checkbox"
                        id="human"
                    >

                    <label for="human">
                        I am human
                    </label>

                </div>


                <button type="submit" class="submit-btn">
                    Submit
                </button>

            </form>

        </div>

    </div>


    <!-- LOGIN LINK -->

    <div class="login-link">

        <p>
            Already have an account?
            <a href="login.html">Sign in</a>
        </p>

    </div>

</body>

</html>
